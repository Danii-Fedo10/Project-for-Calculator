<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Dan Calculator</title>
        <link rel="stylesheet" href="Calculator.css" />
    </head>
    <body>
        <div class="calculator">
            <input id="calculator-input" type="text" readonly />

            <div class="button-row">
                <button class="clear" data-action="clear">C</button>
                <button class="mode" data-action="angle-mode">DEG</button>
                <button data-value="(">(</button>
                <button data-value=")">)</button>
                <button class="operator" data-value="/">/</button>

                <button data-function="sin">sin</button>
                <button data-function="cos">cos</button>
                <button data-function="tan">tan</button>
                <button class="operator" data-value="*">*</button>

                <button data-function="asin">sin⁻¹</button>
                <button data-function="acos">cos⁻¹</button>
                <button data-function="atan">tan⁻¹</button>
                <button class="operator" data-value="-">-</button>

                <button data-function="sqrt">√</button>
                <button data-function="ln">ln</button>
                <button data-function="log">log</button>
                <button class="operator" data-value="+">+</button>

                <button data-value="pi">π</button>
                <button data-value="e">e</button>
                <button data-value="^">xʸ</button>
                <button data-value="^2">x²</button>

                <button data-value="7">7</button>
                <button data-value="8">8</button>
                <button data-value="9">9</button>
                <button data-function="exp">exp</button>

                <button data-value="4">4</button>
                <button data-value="5">5</button>
                <button data-value="6">6</button>
                <button data-value="*">×</button>

                <button data-value="1">1</button>
                <button data-value="2">2</button>
                <button data-value="3">3</button>
                <button data-value="-">−</button>

                <button data-value="0">0</button>
                <button data-value=".">.</button>
                <button class="equals" data-action="equals">=</button>
                <button data-value="+">+</button>
            </div>
        </div>

        <script src="Calculator.js"></script>
    </body>
</html>
